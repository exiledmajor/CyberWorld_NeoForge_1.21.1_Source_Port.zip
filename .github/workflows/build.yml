name: Build CyberWorld NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'CyberWorld_NeoForge_1.21.1_Source_Port.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ported source
        run: unzip -q CyberWorld_NeoForge_1.21.1_Source_Port.zip -d source

      # In 1.21.1 biomes are dynamically registered, so BuiltInRegistries.BIOME is not available.
      - name: Fix Minecraft 1.21.1 biome registry lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/CyberWorld-master/src/main/java/io/github/kuohsuanlo/cyberworld/CyberBiomeGrid.java")
          source = path.read_text(encoding="utf-8")
          source = source.replace("import net.minecraft.core.registries.BuiltInRegistries;\n", "")
          old = "        var key = BuiltInRegistries.BIOME.getKey(holder.value());\n        found = key == null ? Biome.PLAINS : Biome.fromModernName(key.getPath());"
          new = "        var key = holder.unwrapKey().orElse(null);\n        found = key == null ? Biome.PLAINS : Biome.fromModernName(key.location().getPath());"

          if old in source:
              source = source.replace(old, new)
              path.write_text(source, encoding="utf-8")
              print("Applied Minecraft 1.21.1 biome-registry fix.")
          elif new in source and "BuiltInRegistries.BIOME" not in source:
              print("Biome-registry fix is already present; no change needed.")
          else:
              raise SystemExit("Could not safely locate the expected biome-registry code in CyberBiomeGrid.java")
          PY

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic

      - name: Build mod
        working-directory: source/CyberWorld-master
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cyberworld-neoforge-1.21.1
          path: source/CyberWorld-master/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyberworld-build-reports
          path: |
            source/CyberWorld-master/build/reports/**
            source/CyberWorld-master/build/tmp/**
          if-no-files-found: ignore
