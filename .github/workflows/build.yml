
name: Build CyberWorld NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'CyberWorld_NeoForge_1.21.1_Source_Port.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic

      - name: Extract ported source
        run: unzip -q CyberWorld_NeoForge_1.21.1_Source_Port.zip -d source

      - name: Build mod
        working-directory: source/CyberWorld-master
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cyberworld-neoforge-1.21.1
          path: source/CyberWorld-master/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyberworld-build-reports
          path: |
            source/CyberWorld-master/build/reports/**
            source/CyberWorld-master/build/tmp/**
          if-no-files-found: ignore
